name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5433/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      # CPU-only torch keeps the install small; the tests do not load models.
      - run: pip install -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - run: ruff check .
      # Postgres with pgvector + PostGIS, for migration and RLS tests.
      - run: docker compose up -d --build db
      - run: |
          for i in $(seq 1 30); do
            docker compose exec -T db pg_isready -U postgres && exit 0
            sleep 2
          done
          echo "database did not become ready" && exit 1
      - run: pytest -q
